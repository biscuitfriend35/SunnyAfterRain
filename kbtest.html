<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>키보드 테스트</title>
</head>
<body style="font:16px -apple-system,sans-serif;padding:20px">
<p>이 칸을 눌러서 키보드가 뜨는지 봐줘.</p>
<input placeholder="여기 탭" style="display:block;width:100%;padding:12px;font-size:16px;border:2px solid #0a8;border-radius:10px">
<p style="margin-top:24px">숫자 칸</p>
<input type="number" placeholder="숫자" style="display:block;width:100%;padding:12px;font-size:16px;border:2px solid #0a8;border-radius:10px">
</body>
</html>
