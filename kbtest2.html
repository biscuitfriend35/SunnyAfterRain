<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="키보드테스트">
<title>키보드 테스트 (앱 모드)</title>
</head>
<body style="font:16px -apple-system,sans-serif;padding:60px 20px 20px">
<p id="mode"></p>
<p>이 칸을 눌러서 키보드가 뜨는지 봐줘.</p>
<input placeholder="여기 탭" style="display:block;width:100%;padding:12px;font-size:16px;border:2px solid #0a8;border-radius:10px">
<script>document.getElementById('mode').textContent = navigator.standalone ? '홈 화면 앱 모드로 열림' : 'Safari 모드로 열림 (홈 화면에 추가해서 열어줘)';</script>
</body>
</html>
